[package]
name = "dcp"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
fancy-regex = "0.14"
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "masm", "instr_info"] }
memchr = "2.8.3"
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[build-dependencies]
sha2 = "0.11.0"

[lib]
name = "dcp"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "dcp"
path = "src/main.rs"

[[bin]]
name = "dcp-bench"
path = "tools/bench.rs"

[profile.dev]
opt-level = 0
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# a quick optimized build for iterating on the core (measurements on a parity clone): incremental, no LTO
[profile.iter]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
