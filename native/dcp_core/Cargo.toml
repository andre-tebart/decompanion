[package]
name = "dcp_core"
version = "0.1.0"
edition = "2024"

[dependencies]
fancy-regex = "0.14"
memchr = "2.8.3"
pyo3 = { version = "0.30.1", features = ["abi3-py39", "generate-import-lib", "extension-module"] }
regex = "1.13.1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
rustc-hash = "2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[lib]
name = "_core"
crate-type = ["cdylib"]

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
