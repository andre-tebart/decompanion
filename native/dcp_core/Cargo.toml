[package]
name = "dcp_core"
version = "0.1.0"
edition = "2024"

[dependencies]
memchr = "2.8.3"
pyo3 = { version = "0.30.1", features = ["abi3-py39", "generate-import-lib", "extension-module"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

[lib]
name = "_core"
crate-type = ["cdylib"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
